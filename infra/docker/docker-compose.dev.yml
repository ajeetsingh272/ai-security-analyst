# Local development stack.
#
# `pnpm dev:stack` brings everything to healthy in under 90 seconds.
# Health checks gate dependent services, so startup order is deterministic
# rather than hopeful.
#
# Ports are offset from common defaults where collision is likely.

name: sentinel-dev

services:
  # ── Control plane ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
      # Needed so row-level security behaves as it does in production.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      # Host 5434: a natively installed Postgres usually owns 5432, and other
      # project stacks often take 5433. Container-side stays 5432 so nothing
      # inside the stack has to care.
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../db/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinel -d sentinel']
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Event store ───────────────────────────────────────────────────────────
  # NOTE: every healthcheck below uses 127.0.0.1 rather than `localhost`.
  # Inside containers on Docker Desktop/WSL2, `localhost` resolves to ::1 only,
  # and these images bind IPv4 — a `localhost` healthcheck fails permanently
  # against a service that is actually up.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: sentinel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '8123:8123' # HTTP
      - '9000:9000' # native
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
      - ../../db/clickhouse/init:/docker-entrypoint-initdb.d:ro
      # P1-06: a real S3-backed cold storage tier in dev, pointed at the
      # `s3` service below rather than deferred to production Terraform —
      # see clickhouse-storage.xml's own header for why.
      - ./clickhouse-storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
    # The hot/cold storage policy references the s3 disk at startup even
    # before any query touches the cold tier, so s3 needs to exist first —
    # not healthy-gated as tightly as s3-init's own consumers, since
    # ClickHouse doesn't need the sentinel-cold bucket to already exist to
    # boot, only to eventually write into it.
    depends_on:
      s3:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Stream ────────────────────────────────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
    ports:
      - '19092:19092' # Kafka API
      - '9644:9644' # admin
    volumes:
      - rpdata:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - '8080:8080'
    depends_on:
      redpanda:
        condition: service_healthy
    # Without a healthcheck, `up --wait` returns as soon as the container is
    # running, which for a web UI means "the process started", not "it answers".
    # The debugging UIs being reachable is an acceptance criterion, so it gets
    # checked rather than assumed.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080/admin/health']
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Cache, locks, rate limits ─────────────────────────────────────────────
  redis:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Object storage (raw archive + cold tier) ──────────────────────────────
  #
  # SeaweedFS rather than MinIO: MinIO restricted their Docker Hub images, so
  # `docker pull minio/minio` now fails with "unauthorized" on a clean machine.
  # SeaweedFS speaks the same S3 API, is a single binary, and is freely pullable.
  s3:
    image: chrislusf/seaweedfs:3.80
    # -volume.max=20: was 10, too low for three collections (sentinel-archive,
    # sentinel-cold, sentinel-reports) plus default/no-collection usage to
    # share — P1-06's ClickHouse cold-tier testing alone consumed 7 of the
    # 10 slots for sentinel-cold, leaving P1-08's raw archive unable to get
    # a single volume for sentinel-archive at all ("No writable volumes and
    # no free volumes left for collection:sentinel-archive"), confirmed
    # against the live container, not assumed. 20 volumes at 1024MB each is
    # still a bounded 20GB ceiling for a local dev stack — the cap's whole
    # purpose (bounding a single runaway bulk generation, per P1-06's own
    # incident) still holds, just with headroom for more than one
    # collection to actually coexist.
    command: >
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024
      -volume.max=20
    ports:
      - '8333:8333'   # S3 API
      - '9333:9333'   # master UI
      - '8888:8888'   # filer
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 24

  s3-init:
    image: amazon/aws-cli:2.22.0
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: sentineldev
      AWS_SECRET_ACCESS_KEY: sentineldev
      AWS_DEFAULT_REGION: ap-south-1
    volumes:
      - ./s3-lifecycle-archive.json:/etc/s3/lifecycle-archive.json:ro
    # The put-bucket-lifecycle-configuration call below is the REAL,
    # correct configuration for AWS S3 (P1-08 AC3's retention-tier
    # requirement) — but SeaweedFS (this dev stack's S3-compatible
    # backend) accepts the request and silently drops it: a
    # get-bucket-lifecycle-configuration immediately afterward still
    # reports NoSuchLifecycleConfiguration, confirmed empirically against
    # the live container, not assumed. Applying it anyway, unconditionally
    # and idempotently on every boot, costs nothing here and is exactly
    # what a real AWS deployment needs; `|| true` on that one call only,
    # so a dev-stack boot never fails over a limitation of the dev stack's
    # own backend.
    entrypoint: >
      /bin/sh -c "
      for b in sentinel-archive sentinel-cold sentinel-reports; do
        aws --endpoint-url http://s3:8333 s3 mb s3://$$b 2>/dev/null || true;
      done;
      aws --endpoint-url http://s3:8333 s3api put-bucket-lifecycle-configuration --bucket sentinel-archive --lifecycle-configuration file:///etc/s3/lifecycle-archive.json || true;
      aws --endpoint-url http://s3:8333 s3 ls
      "

  # P7-02: a real local implementation of SQS's own wire protocol (ElasticMQ)
  # for the AWS CloudTrail connector — see elasticmq.conf's own doc comment
  # for why this is a real server rather than a hand-rolled mock, same
  # reasoning as the `s3` service above for SeaweedFS.
  sqs:
    image: softwaremill/elasticmq-native:1.6.2
    ports:
      - '9324:9324' # SQS API
      - '9325:9325' # Statistics API / UI
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    # The SQS API port (9324) only speaks AWS's signed REST protocol — an
    # unsigned bare GET (what a simple spider-style healthcheck would send)
    # correctly gets a 400 from it, confirmed against the live container,
    # not assumed. /statistics/queues on the separate statistics port
    # (9325) answers a plain GET with real JSON, so that's the one that
    # actually proves the server is up.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9325/statistics/queues']
      interval: 5s
      timeout: 3s
      retries: 20

  # P7-03: a real local implementation of Event Hubs' own AMQP wire
  # protocol (Microsoft's own official emulator) for the Azure/Entra ID
  # connector — same "real protocol, not a hand-rolled mock" reasoning as
  # `sqs`/`s3` above. The emulator REQUIRES this `azurite` sidecar
  # (Azure Storage emulator) as its own metadata/blob backend — it will
  # not start without one, per Microsoft's own documented topology.
  #
  # ACCEPT_EULA=Y below means exactly what it says: starting this
  # container accepts Microsoft's own Event Hubs Emulator license
  # (https://github.com/Azure/azure-event-hubs-emulator-installer/blob/main/EMULATOR_EULA.md)
  # on whichever machine runs `pnpm dev:stack` — deliberately left
  # visible here rather than hidden in a separate untracked .env file,
  # so anyone running this stack can see exactly what they're agreeing
  # to and why, same transparency this whole connector's own setup docs
  # already apply to a customer's AWS/Azure credentials.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - '10000:10000' # Blob
      - '10001:10001' # Queue
      - '10002:10002' # Table
    # No healthcheck of its own published here — eventhubs-emulator's
    # own healthcheck below is what actually proves this sidecar is
    # working, the same "no healthcheck to poll, not a gap in coverage"
    # framing s3-init's own comment already established for a dependency
    # with nothing meaningful to self-check.

  eventhubs-emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: 'Y'
    ports:
      - '5672:5672' # AMQP — what go/sentinelconnector/azure's own azeventhubs client speaks
      - '5300:5300' # Emulator's own management/health port
      - '9093:9092' # Kafka-compatible API (offset host-side, same "avoid colliding with a real Kafka" reasoning redpanda's own 19092 uses) — unused by this connector, published for parity/debugging only
    volumes:
      - ./eventhubs-emulator-config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      - azurite
    # No healthcheck: this image has no shell, wget, or curl at all
    # (confirmed against the live container — `docker exec ... sh` fails
    # with "executable file not found"), so there is nothing a
    # Docker-exec-based HEALTHCHECK could even run. Same "no healthcheck
    # to poll, not a gap in coverage" framing otel-collector's own
    # comment above already establishes for an image with nothing
    # exec-able inside it. The emulator logs its own startup health
    # probe result ("Emulator Service is Successfully Up!") instead —
    # readiness is observed there, or empirically by a real client
    # connecting (this package's own integration test retries on
    # connection failure for exactly this reason).

  # ── Observability (P0-10) ──────────────────────────────────────────────────
  #
  # Every service exports OTLP to otel-collector (4317/4318), never to Jaeger
  # or Prometheus directly — otel-collector-config.yaml is the one place that
  # knows traces go to Jaeger and metrics go to Prometheus, so a service's own
  # code never has to care about that split. Jaeger's 4317/4318 therefore
  # moved from "published to the host, apps connect here" to
  # "container-network-only, the collector connects here" — nothing on the
  # host should point at Jaeger's OTLP ports any more.
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # UI
    # 4317/4318 (OTLP) and 14269 (admin, used by the healthcheck) stay
    # internal — only otel-collector and this container's own healthcheck
    # reach them, over the docker network.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:14269/']
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC — every service points here now
      - '4318:4318' # OTLP HTTP
      - '8889:8889' # Prometheus-scrapable metrics, published for ad-hoc debugging
      - '13133:13133' # health_check extension — see the note below
    depends_on:
      jaeger:
        condition: service_healthy
    # No Docker healthcheck on THIS service, by necessity rather than choice:
    # otel-collector-contrib's image is fully distroless — no shell, no
    # wget/curl, no `ls`, nothing executable but the collector binary itself
    # (confirmed by trying each of those and getting "executable file not
    # found" every time). A CMD-based healthcheck needs an executable to run
    # INSIDE the container, and there is none. The health_check extension
    # still runs and answers real GET requests on 13133 — just not from
    # Docker's own probe mechanism. scripts/check-stack.sh accordingly treats
    # this service the same way it already treats s3-init: no healthcheck
    # to poll, not a gap in coverage.

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=24h'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    # service_started, not service_healthy — otel-collector has no healthcheck
    # (see its own comment above for why). Prometheus will retry its scrape
    # on the usual interval regardless, so starting slightly before the
    # collector's extensions finish initializing costs one missed scrape
    # cycle at most, not a failure.
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9090/-/healthy']
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
      # No real secret guarded by this — a throwaway local dev instance with
      # nothing but Prometheus metrics behind it. Never reused for anything
      # that is actually deployed.
      GF_SECURITY_ADMIN_PASSWORD: 'sentineldev'
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - '3001:3000' # 3000 is the dashboard app's port (README) — offset here
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  chdata:
  rpdata:
  redisdata:
  s3data:
  grafanadata:
