# Local development stack.
#
# `pnpm dev:stack` brings everything to healthy in under 90 seconds.
# Health checks gate dependent services, so startup order is deterministic
# rather than hopeful.
#
# Ports are offset from common defaults where collision is likely.

name: sentinel-dev

services:
  # ── Control plane ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
      # Needed so row-level security behaves as it does in production.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      # Host 5434: a natively installed Postgres usually owns 5432, and other
      # project stacks often take 5433. Container-side stays 5432 so nothing
      # inside the stack has to care.
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../db/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinel -d sentinel']
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Event store ───────────────────────────────────────────────────────────
  # NOTE: every healthcheck below uses 127.0.0.1 rather than `localhost`.
  # Inside containers on Docker Desktop/WSL2, `localhost` resolves to ::1 only,
  # and these images bind IPv4 — a `localhost` healthcheck fails permanently
  # against a service that is actually up.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: sentinel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '8123:8123' # HTTP
      - '9000:9000' # native
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
      - ../../db/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Stream ────────────────────────────────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
    ports:
      - '19092:19092' # Kafka API
      - '9644:9644' # admin
    volumes:
      - rpdata:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - '8080:8080'
    depends_on:
      redpanda:
        condition: service_healthy
    # Without a healthcheck, `up --wait` returns as soon as the container is
    # running, which for a web UI means "the process started", not "it answers".
    # The debugging UIs being reachable is an acceptance criterion, so it gets
    # checked rather than assumed.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080/admin/health']
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Cache, locks, rate limits ─────────────────────────────────────────────
  redis:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Object storage (raw archive + cold tier) ──────────────────────────────
  #
  # SeaweedFS rather than MinIO: MinIO restricted their Docker Hub images, so
  # `docker pull minio/minio` now fails with "unauthorized" on a clean machine.
  # SeaweedFS speaks the same S3 API, is a single binary, and is freely pullable.
  s3:
    image: chrislusf/seaweedfs:3.80
    command: >
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024
      -volume.max=10
    ports:
      - '8333:8333'   # S3 API
      - '9333:9333'   # master UI
      - '8888:8888'   # filer
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 24

  s3-init:
    image: amazon/aws-cli:2.22.0
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: sentineldev
      AWS_SECRET_ACCESS_KEY: sentineldev
      AWS_DEFAULT_REGION: ap-south-1
    entrypoint: >
      /bin/sh -c "
      for b in sentinel-archive sentinel-cold sentinel-reports; do
        aws --endpoint-url http://s3:8333 s3 mb s3://$$b 2>/dev/null || true;
      done;
      aws --endpoint-url http://s3:8333 s3 ls
      "

  # ── Observability ─────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # UI
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    # 14269 is Jaeger's admin port. It is deliberately not published to the host:
    # the healthcheck runs inside the container, and exposing an admin endpoint to
    # the host buys nothing a developer needs.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:14269/']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  chdata:
  rpdata:
  redisdata:
  s3data:
