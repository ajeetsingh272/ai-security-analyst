global:
  scrape_interval: 10s

scrape_configs:
  # The collector, not any app directly — every app's metrics already
  # arrived here via OTLP push (otel-collector-config.yaml's prometheus
  # exporter); this is the one scrape target regardless of how many
  # services exist.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
