// P7-02: a real local SQS-protocol server for the AWS CloudTrail
// connector's integration tests (go/sentinelconnector/aws) — same
// reasoning seaweedfs-s3.json already established for S3: a real
// implementation of the vendor's documented wire protocol, run locally,
// is strictly more honest than a hand-rolled HTTP mock, because this
// ticket's own AC2 ("SQS consumption with correct visibility timeout and
// deletion semantics") and T2 ("a consumer crash before deletion results
// in redelivery, not loss") are claims ABOUT that exact protocol's
// subtle behaviour — a mock that only echoes back fixed JSON could never
// actually prove either one.
//
// No queue is predefined here, and auto-create-queues is deliberately
// NOT used (confirmed against the live 1.6.2 image that it doesn't take
// effect for this image/version, and chasing that further wasn't worth
// it): every test creates its own uniquely-named queue via a real
// CreateQueue call and deletes it in cleanup — the same
// "randomUUID-scoped resource, cleaned up in t.Cleanup" convention this
// repo's other integration tests already use for tenants/topics, and
// closer to how a real deployment provisions queues via Terraform anyway.
include classpath("application.conf")
