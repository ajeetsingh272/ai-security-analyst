apiVersion: 1
datasources:
  - name: Prometheus
    # Pinned rather than left to Grafana's auto-generated uid, so the
    # provisioned dashboard JSON (dashboards/json/golden-signals.json) can
    # reference this datasource by a stable id instead of "whatever Grafana
    # happened to hash the name to on this run".
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
