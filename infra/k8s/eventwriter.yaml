apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventwriter
  namespace: sentinel
spec:
  replicas: 2
  selector:
    matchLabels: { app: eventwriter }
  template:
    metadata:
      labels: { app: eventwriter }
    spec:
      nodeSelector: { "sentinel.io/node-pool": "apps" }
      containers:
        - name: eventwriter
          image: sentinel-eventwriter:latest
          ports:
            - containerPort: 8102
          env:
            - name: CONSUMER_GROUP
              value: eventwriter
            - name: REDPANDA_BROKERS
              value: "redpanda.sentinel.svc.cluster.local:9093"
            - name: CLICKHOUSE_ADDR
              value: "clickhouse.sentinel.svc.cluster.local:9000"
            - name: CLICKHOUSE_DATABASE
              value: sentinel
          envFrom:
            - secretRef: { name: clickhouse-admin }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8102 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8102 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eventwriter
  namespace: sentinel
spec:
  selector: { app: eventwriter }
  ports:
    - port: 8102
      targetPort: 8102
---
# AC3: CPU-based — same disclosed gap as correlate.yaml's own HPA
# comment (no consumer-lag metric exists for this service yet).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eventwriter
  namespace: sentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eventwriter
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
