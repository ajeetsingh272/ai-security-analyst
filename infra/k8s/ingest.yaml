apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingest
  namespace: sentinel
  annotations:
    # Placeholder — replace with the real value of Terraform's own
    # `aws_iam_role.ingest_s3.arn` output before applying (CI
    # substitutes this the same way it substitutes each Deployment's
    # own `image:` tag below).
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/sentinel-prod-ingest-s3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: sentinel
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingest }
  template:
    metadata:
      labels: { app: ingest }
    spec:
      serviceAccountName: ingest
      nodeSelector: { "sentinel.io/node-pool": "apps" }
      containers:
        - name: ingest
          image: sentinel-ingest:latest
          ports:
            - containerPort: 8101
          env:
            - name: REDPANDA_BROKERS
              value: "redpanda.sentinel.svc.cluster.local:9093"
            - name: REDIS_ADDR
              value: "valkey.sentinel.svc.cluster.local:6379"
            - name: S3_ARCHIVE_BUCKET
              value: sentinel-archive
            - name: S3_REGION
              value: ap-south-1
            # No S3_ACCESS_KEY/S3_SECRET_KEY — IRSA (the ServiceAccount
            # annotation above) is what AC4 actually means here: the
            # AWS SDK's own default credential chain picks up the
            # IRSA-issued, auto-rotated token, never a static key pair
            # the dev stack's own sentineldev/sentineldev stand-in
            # uses.
          envFrom:
            - secretRef: { name: postgres }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8101 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8101 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
  namespace: sentinel
spec:
  selector: { app: ingest }
  ports:
    - port: 8101
      targetPort: 8101
---
# AC3: CPU-based, deliberately — ingest is a polling connector
# scheduler, not a Kafka consumer-group member with a lag concept the
# way detect/correlate/eventwriter are; its own real bottleneck is
# outbound HTTP calls to connector APIs, which CPU utilization tracks
# reasonably (not perfectly) well.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingest
  namespace: sentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingest
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
