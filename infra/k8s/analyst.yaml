apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyst
  namespace: sentinel
spec:
  replicas: 2
  selector:
    matchLabels: { app: analyst }
  template:
    metadata:
      labels: { app: analyst }
    spec:
      nodeSelector: { "sentinel.io/node-pool": "apps" }
      containers:
        - name: analyst
          image: sentinel-analyst:latest
          ports:
            - containerPort: 8105
          env:
            - name: CONSUMER_GROUP
              value: analyst
            - name: REDPANDA_BROKERS
              value: "redpanda.sentinel.svc.cluster.local:9093"
            - name: ANALYST_HEALTH_PORT
              value: "8105"
          envFrom:
            - secretRef: { name: postgres }
            - secretRef: { name: clickhouse-admin }
            - secretRef: { name: anthropic-api-key }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          # AC2: GET /health (src/main.ts's own embedded health server,
          # added in this same ticket — this worker otherwise has no
          # HTTP surface at all).
          livenessProbe:
            httpGet: { path: /health, port: 8105 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8105 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: analyst
  namespace: sentinel
spec:
  selector: { app: analyst }
  ports:
    - port: 8105
      targetPort: 8105
---
# AC3: CPU-based, disclosed gap — analyst consumes the `cases` topic
# via kafkajs (apps/analyst/src/kafka.ts), which has no lag-reporting
# wired up at all (a different mechanism than franz-go's own kadm
# client the Go services use would be needed — real, separable future
# work, not assumed done here).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analyst
  namespace: sentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analyst
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
