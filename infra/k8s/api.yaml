apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sentinel
spec:
  replicas: 3
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      nodeSelector: { "sentinel.io/node-pool": "apps" }
      containers:
        - name: api
          image: sentinel-api:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "4000"
            - name: REDIS_URL
              value: "redis://valkey.sentinel.svc.cluster.local:6379" # no AUTH — matches the dev stack's own simplicity; disclosed, not silently assumed secure. Production should add Valkey AUTH + TLS as follow-up, same disclosed-gap pattern as Redpanda SASL (addons.tf's own comment).
          envFrom:
            - secretRef: { name: postgres }
            - secretRef: { name: clickhouse-admin }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2", memory: "1Gi" }
          # AC2: apps/api/src/app.ts's own pre-existing GET /health,
          # GET /ready.
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sentinel
spec:
  selector: { app: api }
  ports:
    - port: 4000
      targetPort: 4000
---
# AC3: CPU-based — api is a user-facing control-plane HTTP service,
# where request-driven CPU load is a reasonable, standard autoscaling
# signal (unlike detect's own backlog-driven workload).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: sentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
