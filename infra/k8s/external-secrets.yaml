# P7-06 / ADR-0013 AC4: syncs the four AWS Secrets Manager entries
# infra/terraform/secrets.tf creates into native Kubernetes Secret
# objects, via the ClusterSecretStore Terraform's own
# kubernetes_manifest.cluster_secret_store already registers. Every
# Deployment below references ONE of these four Secret names — never
# a literal credential value in this file or any other manifest.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres
  namespace: sentinel
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: postgres
    # Every Go and TS service in this repo reads one assembled
    # POSTGRES_URL (go/sentineldb.NewPool, apps/api's own Pool
    # constructor), not separate host/port/user fields — templated
    # here rather than asking every service to assemble it itself.
    template:
      data:
        POSTGRES_URL: "postgres://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .database }}"
  dataFrom:
    - extract:
        key: sentinel-prod/postgres
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clickhouse-admin
  namespace: sentinel
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: clickhouse-admin
    # Both shapes every ClickHouse-reading service in this repo
    # actually uses: the Go services (detect/correlate/eventwriter)
    # read CLICKHOUSE_USER/CLICKHOUSE_PASSWORD/CLICKHOUSE_ADDR
    # separately (native protocol, port 9000); the TS services
    # (api/analyst) read one CLICKHOUSE_URL (HTTP, port 8123) —
    # see apps/api/src/clickhouse.ts's own createClient call.
    template:
      data:
        CLICKHOUSE_USER: "{{ .username }}"
        CLICKHOUSE_PASSWORD: "{{ .password }}"
        CLICKHOUSE_URL: "http://{{ .username }}:{{ .password }}@clickhouse.sentinel.svc.cluster.local:8123"
  dataFrom:
    - extract:
        key: sentinel-prod/clickhouse
# No ExternalSecret for sentinel-prod/redpanda here, deliberately:
# the Secrets Manager entry exists (infra/terraform/secrets.tf) but
# addons.tf's own Redpanda Helm release does NOT enforce SASL yet —
# none of this repo's Kafka clients send SASL credentials today (see
# that file's own doc comment). Syncing an unused Secret into the
# cluster would be dead weight; add this ExternalSecret back in the
# same change that adds real SASL support to every consumer.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: anthropic-api-key
  namespace: sentinel
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: anthropic-api-key
  dataFrom:
    - extract:
        key: sentinel-prod/anthropic-api-key
