name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filtering keeps a docs-only change from running the whole matrix.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      go: ${{ steps.filter.outputs.go }}
      db: ${{ steps.filter.outputs.db }}
      planning: ${{ steps.filter.outputs.planning }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ts:
              - 'apps/**'
              - 'packages/**'
              - 'tools/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
            go:
              - 'services/**'
              - 'go.work'
              - 'go.work.sum'
            # Without this, adding a migration changed nothing CI looks at, so
            # the schema could move without a single check running against it.
            db:
              - 'db/**'
              - 'scripts/**'
              - 'infra/**'
              - 'docs/architecture/data-model.md'
            planning:
              - 'planning/**'

  typescript:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs first: it checks that every package declares the scripts the gates
      # below invoke. `turbo run typecheck` reports success for a package with
      # no typecheck script, so without this a package can silently opt out of
      # every check that follows.
      - name: Validate workspace manifests
        run: node scripts/validate-workspace.mjs

      # Each gate reports its own real exit code. Nothing is piped to tail or
      # grep — a swallowed failure here is a failure that ships.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  # P0-01 T1 — install and build with no cached state of any kind.
  #
  # The `typescript` job above restores the pnpm store and the Turborepo cache,
  # which is what makes it fast and also what makes it a poor test of a first
  # clone. A lockfile that resolves only because a package is already in the
  # store, or a build that only passes because a stale artefact was replayed,
  # both look green there and fail for the next person who clones the repo.
  #
  # So this job turns both caches off: no `cache: pnpm`, and TURBO_FORCE to make
  # every task actually execute rather than replay.
  clean-clone:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_FORCE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --frozen-lockfile is the point: it fails if the lockfile does not already
      # satisfy every manifest, which is the state a fresh clone is in.
      - name: Install from a cold store
        run: pnpm install --frozen-lockfile

      - name: Build with no cache replay
        run: pnpm build

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: '**/go.sum'

      # With a go.work, the repo root is not a module, so `./...` cannot
      # resolve from here. These scripts enter each module explicitly.
      - name: Vet and test with race detector
        run: bash scripts/go-test.sh

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/ingest

      - name: Build
        run: bash scripts/go-build.sh

  # Enforces the rule from CONTRIBUTING.md: every detection rule carries a
  # MITRE technique and both a positive and a negative fixture. A rule without
  # a negative fixture is a false-positive generator, so the build refuses it.
  detections:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Validate detection rules
        run: bash scripts/validate-detections.sh

  # Isolation is tested, not assumed. Runs against real containers.
  integration:
    needs: changes
    if: |
      needs.changes.outputs.ts == 'true' ||
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - run: pnpm install --frozen-lockfile

      - name: Start dev stack
        run: docker compose -f infra/docker/docker-compose.dev.yml up -d --wait

      - name: Migrate
        run: pnpm db:migrate

      # Every tenant-scoped table carries a non-null tenant_id. Enumerated from
      # the live database, so a new table cannot opt out by not being noticed.
      - name: Schema tenancy lint
        run: pnpm db:validate

      # Migrates a throwaway database from empty and asserts the seed is
      # idempotent. Production is migrated from empty exactly once, and this is
      # the only place that path is exercised.
      - name: Migrations from empty, seed idempotency
        run: pnpm db:check

      # The data model document is generated from the schema. If a migration
      # landed without regenerating it, the committed document is now a
      # confident description of a schema that no longer exists.
      - name: Data model doc is current
        run: pnpm db:docs:check

      - name: Integration tests
        run: pnpm test:integration

      - name: Tenant isolation suite
        run: pnpm test:integration --project=isolation

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.dev.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker/docker-compose.dev.yml down -v

  planning:
    needs: changes
    if: needs.changes.outputs.planning == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate backlog
        run: node scripts/validate-backlog.mjs
