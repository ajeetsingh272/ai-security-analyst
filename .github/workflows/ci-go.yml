name: CI · Go

# The Go half of CI (P0-02), separate from TypeScript so the two run concurrently
# and gate independently. See ci-typescript.yml for why the trigger carries no
# `paths:` filter and the filtering happens in the `changes` job instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter calls the GitHub API (listFiles) to get a pull request's
  # changed files. Without this it fails with "Resource not accessible by
  # integration" and every downstream job is skipped — which reads as a passing
  # pipeline that quietly tested nothing.
  pull-requests: read

jobs:
  changes:
    name: changes · go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      detections: ${{ steps.filter.outputs.detections }}
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'services/**'
              - 'go/**'
              - 'go.work'
              - 'go.work.sum'
              - 'scripts/go-*.sh'
              - '.github/workflows/ci-go.yml'
            # Rules are data, not code: a new rule with a missing fixture must be
            # caught even when no Go source changed.
            detections:
              - 'detections/**'
              - 'services/detect/**'
              - 'scripts/validate-detections.sh'
              - '.github/workflows/ci-go.yml'
            # P0-11: the Go structs under go/sentinelschema are generated FROM
            # packages/schema/src/index.ts, so a change on either side can make
            # the committed output stale and needs both toolchains to check.
            schema:
              - 'packages/schema/**'
              - 'go/sentinelschema/**'
              - '.github/workflows/ci-go.yml'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: '**/go.sum'

      # With a go.work, the repo root is not a module, so `./...` cannot
      # resolve from here. These scripts enter each module explicitly.
      #
      # CI runs the race detector. The developer machine cannot — it needs cgo
      # and a C compiler — so go-test.sh skips it there with a note. This is the
      # only place races are actually caught, which is why it must not be skipped.
      - name: Vet and test with race detector
        run: bash scripts/go-test.sh

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/ingest

      - name: Build
        run: bash scripts/go-build.sh

  # Enforces the rule from CONTRIBUTING.md: every detection rule carries a
  # MITRE technique and both a positive and a negative fixture. A rule without
  # a negative fixture is a false-positive generator, so the build refuses it.
  detections:
    needs: changes
    if: needs.changes.outputs.detections == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Validate detection rules
        run: bash scripts/validate-detections.sh

  # P0-11: packages/schema/src/index.ts is the one source of truth; everything
  # here checks that what is committed actually follows from it. Needs both
  # toolchains — generate-go.mjs pipes its output through gofmt, and
  # roundtrip-check.mjs shells out to `go run` — so it is its own job rather
  # than folded into either `go` (no Node there) or ci-typescript.yml (no Go).
  schema:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # AC3, T1 — fails if go/sentinelschema/schema.gen.go does not match
      # what regenerating from src/index.ts right now would produce.
      - name: Generated Go structs are current
        run: pnpm --filter @sentinel/schema generate:check

      # AC4, T3 — fails on a breaking shape change with no MAJOR version bump,
      # and separately on schema.snapshot.json simply being stale.
      - name: Schema compatibility baseline is current
        run: pnpm --filter @sentinel/schema check-compat:check

      # T2 — the only genuinely cross-language proof here: a real object,
      # constructed in TypeScript, actually survives TS -> Go -> TS with
      # every field intact.
      - name: Round-trip TS -> Go -> TS
        run: pnpm --filter @sentinel/schema roundtrip-check

      - name: Build go/sentinelschema
        run: cd go/sentinelschema && go build ./... && go vet ./...
