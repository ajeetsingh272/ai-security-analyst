title: Credential added to an application's service principal
id: 8f1a2b3c-0001-4a00-9000-000000000014
status: stable
description: >
  Detects a new secret or certificate credential added to an existing
  service principal — a common persistence step once an attacker has
  enough privilege to modify an application, letting them authenticate
  as that app going forward without needing any user's password.
owner_description: >
  A new password or security certificate was added to one of the
  company's connected apps. If IT did not do this, it may let someone
  sign in as that app without ever needing a person's password.
author: Sentinel detection engineering
date: 2026/10/06
tags:
  - attack.t1098.001
logsource:
  category: application
  product: m365
  service: azuread
detection:
  selection:
    Operation: 'Add service principal credentials.'
  condition: selection
falsepositives:
  - A developer rotating an app's secret as part of routine credential hygiene
level: high
