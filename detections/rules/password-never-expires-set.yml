title: Account password set to never expire
id: 8f1a2b3c-0001-4a00-9000-000000000038
status: experimental
description: >
  Detects PasswordNeverExpires being set to true on a user — weakens a
  standard credential-hygiene control, and is occasionally used by an
  attacker on an account they control to guarantee a stolen password
  keeps working indefinitely.
owner_description: >
  An account was set up so its password never has to be changed. This
  removes a normal safety net — if that password were ever stolen, it
  would keep working indefinitely.
author: Sentinel detection engineering
date: 2026/10/06
tags:
  - attack.t1098
logsource:
  category: application
  product: m365
  service: azuread
detection:
  selection:
    Operation: 'Set-User'
    PasswordNeverExpires: 'True'
  condition: selection
falsepositives:
  - IT deliberately exempting a service account that cannot handle interactive password resets
level: medium
