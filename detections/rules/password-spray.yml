title: Password spray against multiple accounts from one source
id: 8f1a2b3c-0001-4a00-9000-000000000009
status: experimental
description: >
  Detects one source IP failing sign-in for more distinct UserId values
  than is plausible for legitimate traffic within a short window — the
  classic low-and-slow password spray shape (one or two guesses per
  account, many accounts, so no single account's own lockout threshold
  trips).
owner_description: >
  One computer tried signing in to several different accounts and
  failed, all within a few minutes. This is a common way attackers try
  to guess passwords across many accounts at once, instead of guessing
  many passwords against just one account.
author: Sentinel detection engineering
date: 2026/10/06
tags:
  - attack.t1110.003
logsource:
  category: application
  product: m365
  service: azuread
detection:
  selection:
    Operation: 'UserLoginFailed'
  condition: selection | count() by ClientIP, UserId > 5 within 10m
falsepositives:
  - A shared office network address where several people mistype passwords around the same time
level: high
