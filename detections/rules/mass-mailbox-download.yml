title: Mass mailbox item access within a short window
id: 8f1a2b3c-0001-4a00-9000-000000000006
status: stable
description: >
  Detects an unusually high volume of mailbox item access by a single
  user in a short window — consistent with bulk exfiltration via a mail
  client or export tool after a mailbox is compromised. Routed to the
  windowed engine (ADR-0004 §3.5): this needs a count over a time window,
  which the in-stream dispatch tree does not evaluate.
author: Sentinel detection engineering
date: 2026/10/06
tags:
  - attack.t1114.002
logsource:
  category: application
  product: m365
  service: exchange
detection:
  selection:
    Operation: 'MailItemsAccessed'
  condition: selection | count() by UserId > 500 within 10m
falsepositives:
  - A mail client's own periodic full sync
level: high
